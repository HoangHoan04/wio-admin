apiVersion: apps/v1
kind: Deployment
metadata:
  name: wio-admin
  namespace: wio
  labels:
    app: wio-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wio-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: wio-admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/YOUR_GH_OWNER/wio-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
